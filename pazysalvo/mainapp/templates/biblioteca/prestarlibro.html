{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prestar Libro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/prestar_libro.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    {% if messages %}
      <div class="message-container">
        {% for message in messages %}
          <div class="message {{ message.tags }}">
            <span class="message-text">{{ message }}</span>
            <button class="close-btn" onclick="this.parentElement.style.opacity='0'; setTimeout(() => this.parentElement.remove(), 300);">&times;</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
    <section class="prestamo-libro">
        <div class="barra-superior">
            <a href="{% url 'inicio' %}" class="btn-volver">← Volver</a>
            <h1 class="titulo">Prestar Libro</h1>
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="aprendiz">Aprendiz</label>
                <div class="input-group">
                    <input type="text" id="aprendiz" name="aprendiz" placeholder="Documento del usuario" required>
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="libro">Libro</label>
                <div class="input-group">
                    <input type="text" id="libro" name="libro" placeholder="Título del libro" required>
                    <i class="fa-solid fa-book"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha de préstamo</label>
                <div class="input-group">
                    <input type="date" id="fecha" name="fecha" required>
                    <i class="fa-solid fa-calendar-day"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">Registrar préstamo</button>

            <div class="separador"><span>o</span></div>

            <div class="excel-section">
                <div class="form-group">
                    <label for="archivo_excel">Subir Excel de morosos</label>
                    <div class="input-file-group">
                        <input type="file" id="archivo_excel" name="archivo_excel" accept=".xlsx, .xls">
                        <i class="fa-solid fa-file-excel"></i>
                    </div>
                </div>
                <button type="submit" name="subir_excel" value="1" class="btn-submit">Subir listado de morosos</button>
            </div>
        </form>
    </section>

<script>
    // 🚀 SCRIPT PARA AUTO-OCULTAR LAS ALERTAS A LOS 3 SEGUNDOS
    document.addEventListener('DOMContentLoaded', () => {
        const messages = document.querySelectorAll('.message-container .message');
        messages.forEach(message => {
            // Establece un temporizador para iniciar la transición de ocultamiento
            setTimeout(() => {
                message.style.opacity = '0'; // Inicia la transición CSS (fade-out)
                // Elimina el elemento del DOM después de que la transición CSS termine (300ms)
                setTimeout(() => message.remove(), 300);
            }, 3000); // 3 segundos (3000 milisegundos)
        });
    });
</script>
</body>
</html>
