{% extends 'base.html' %}
{% load static %}

{% block title %}Prestar Libro{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/prestar_libro.css' %}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
{% endblock %}

{% block content %}
<section class="prestamo-libro">
    <div class="barra-superior">
        <a href="{% url 'inicio' %}" class="btn-volver">← Volver</a>
        <h1 class="titulo">Prestar Libro</h1>
    </div>

    <form method="post" enctype="multipart/form-data" id="form-manual">
        {% csrf_token %}
        <div class="form-group">
            <label for="aprendiz">Aprendiz</label>
            <div class="input-group">
                <input type="text" id="aprendiz" name="aprendiz" placeholder="Documento del usuario" required>
                <i class="fa-solid fa-user"></i>
            </div>
        </div>
        <div class="form-group">
            <label for="libro">Libro</label>
            <div class="input-group">
                <input type="text" id="libro" name="libro" placeholder="Título del libro" required>
                <i class="fa-solid fa-book"></i>
            </div>
        </div>
        <div class="form-group">
            <label for="fecha">Fecha de préstamo</label>
            <div class="input-group">
                <input type="date" id="fecha" name="fecha_prestamo" required>
                <i class="fa-solid fa-calendar-day"></i>
            </div>
        </div>
        <div class="form-group">
            <label for="centro_formacion">Centro de Formación</label>
            <div class="input-group">
                <input type="text" id="centro_formacion" name="centro_formacion" placeholder="Centro de Formación">
                <i class="fa-solid fa-building"></i>
            </div>
        </div>
        <div class="form-group">
            <label for="tipo_material">Tipo de material</label>
            <div class="input-group">
                <input type="text" id="tipo_material" name="tipo_material" placeholder="Tipo de material">
                <i class="fa-solid fa-layer-group"></i>
            </div>
        </div>
        <div class="form-group">
            <label for="tiempo_prestamo">Tiempo de préstamo</label>
            <div class="input-group">
                <input type="text" id="tiempo_prestamo" name="tiempo_prestamo" placeholder="Ej: 15 días">
                <i class="fa-solid fa-clock"></i>
            </div>
        </div>
        <button type="submit" class="btn-submit">Registrar préstamo</button>
    </form>

    <div class="separador"><span>o</span></div>

    <form method="post" enctype="multipart/form-data" id="form-excel">
        {% csrf_token %}
        <div class="excel-section">
            <div class="form-group">
                <label for="archivo_excel">Subir Excel de morosos</label>
                <div class="input-file-group">
                    <input type="file" id="archivo_excel" name="archivo_excel" accept=".xlsx, .xls" required>
                    <i class="fa-solid fa-file-excel"></i>
                </div>
            </div>
            <button type="submit" name="subir_excel" value="1" class="btn-submit">Subir listado de morosos</button>
        </div>
    </form>
</section>
{% endblock %}
