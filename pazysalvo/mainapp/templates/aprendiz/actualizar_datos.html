<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Datos</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/actualizar_datos.css' %}">
    
    
</head>
<body>
    <div class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2>Actualización de Datos</h2>
                <p>Hola <strong>{{ usuario.nombre }}</strong>, necesitamos que actualices tu información antes de continuar.</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                <!-- Sección: Información Personal -->
                <div class="form-section">
                    <h3>Información Personal</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="id_tipodoc_FK">Tipo de Documento <span class="required">*</span></label>
                            <select name="id_tipodoc_FK" id="id_tipodoc_FK" required>
                                <option value="">Seleccione...</option>
                                {% for tipo in tipos_doc %}
                                    <option value="{{ tipo.id }}" 
                                        {% if usuario.id_tipodoc_FK and usuario.id_tipodoc_FK.id == tipo.id %}selected{% endif %}>
                                        {{ tipo.nombre_tipo }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fecha_nacimiento">Fecha de Nacimiento <span class="required">*</span></label>
                            <input type="date" name="fecha_nacimiento" id="fecha_nacimiento" 
                                   value="{% if ag_empleo.fecha_nacimiento %}{{ ag_empleo.fecha_nacimiento|date:'Y-m-d' }}{% endif %}" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="telefono">Teléfono Principal <span class="required">*</span></label>
                            <input type="tel" name="telefono" id="telefono" 
                                   value="{% if ag_empleo.telefono %}{{ ag_empleo.telefono }}{% endif %}" 
                                   placeholder="Ej: 3001234567" required>
                        </div>

                        <div class="form-group">
                            <label for="telefono_2">Teléfono Secundario</label>
                            <input type="tel" name="telefono_2" id="telefono_2" 
                                   value="{% if ag_empleo.telefono_2 %}{{ ag_empleo.telefono_2 }}{% endif %}" 
                                   placeholder="Ej: 3001234567">
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="correo">Correo Electrónico <span class="required">*</span></label>
                        <input type="email" name="correo" id="correo" 
                               value="{% if ag_empleo.correo %}{{ ag_empleo.correo }}{% endif %}" 
                               placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <!-- Sección: Información Laboral -->
                <div class="form-section">
                    <h3> Información de Empleo (Etapa Productiva)</h3>
                    
                    <div class="form-group full-width">
                        <label for="nombre_empresa">Nombre de la Empresa</label>
                        <input type="text" name="nombre_empresa" id="nombre_empresa" 
                               value="{% if ag_empleo.nombre_empresa %}{{ ag_empleo.nombre_empresa }}{% endif %}" 
                               placeholder="Nombre de la empresa donde realiza su etapa productiva">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="fecha_inicio_empresa">Fecha de Inicio</label>
                            <input type="date" name="fecha_inicio_empresa" id="fecha_inicio_empresa" 
                                   value="{% if ag_empleo.fecha_inicio_empresa %}{{ ag_empleo.fecha_inicio_empresa|date:'Y-m-d' }}{% endif %}">
                        </div>

                        <div class="form-group">
                            <label for="fecha_fin_empresa">Fecha de Finalización</label>
                            <input type="date" name="fecha_fin_empresa" id="fecha_fin_empresa" 
                                   value="{% if ag_empleo.fecha_fin_empresa %}{{ ag_empleo.fecha_fin_empresa|date:'Y-m-d' }}{% endif %}">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-actualizar">Actualizar Datos y Continuar</button>
            </form>
        </div>
    </div>
</body>
</html>
